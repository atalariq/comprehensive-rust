name: Publish Indonesian fork HTML
on:
  push:
    branches: [indonesian]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install HTML tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gettext zip
          rustup update stable --no-self-update
          rustup default stable
          cargo install --locked --version 0.5.4 mdbook
          cargo install --locked --version 0.4.0 mdbook-i18n-helpers
          cargo install --locked --version 0.13.0 mdbook-linkcheck2
          cargo install --locked --version 0.3.1 mdbook-svgbob
          cargo build --locked --release -p mdbook-course -p mdbook-exerciser
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Check pinned translation and build English/Indonesian HTML
        run: |
          python3 scripts/check-id-translation.py
          sh scripts/build-pages.sh book-pages
          python3 scripts/check-id-rendered.py book-pages/site/en book-pages/site/id
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: book-pages/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
